<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="./manifest.webmanifest"><title>Gingerbeard Weather · GBW</title><style>:root{--o:#ff6428;--b:#00b7ef;--bg:#111;--p:#191919;--m:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1000px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.brand{font-size:12px;letter-spacing:1.5px;color:#aaa;font-weight:900}.place{font-size:28px;font-weight:900}.temp{font-size:56px;font-weight:900;color:var(--o);line-height:1;text-align:right}.muted{color:var(--m)}.card{background:var(--p);border:1px solid #2b2b2b;border-radius:18px;padding:16px;margin-top:14px}.chart{width:100%;height:330px;display:block}.legend{font-size:12px;font-weight:800;color:#bbb;margin-bottom:8px}.watch h3{margin:0 0 6px}.watch p{margin:0;color:#bbb;line-height:1.45}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric,.day{background:#202020;border:1px solid #303030;border-radius:13px;padding:12px}.metric small{color:#999;font-weight:800}.metric b{display:block;font-size:19px;margin-top:4px}.days{display:flex;gap:9px;overflow-x:auto}.day{min-width:112px;text-align:center}.day b{display:block}.ico{font-size:24px;margin:7px}.status{font-size:12px;color:#888;margin:12px 2px}.gbw-embed .top,.gbw-embed .status{display:none}@media(max-width:650px){.app{padding:12px}.place{font-size:22px}.temp{font-size:44px}.metrics{grid-template-columns:repeat(2,1fr)}.chart{height:300px}}</style><script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('gbw-embed')</script></head><body><main class="app"><header class="top"><div><div class="brand">GINGERBEARD WEATHER · GBW 1.0</div><div class="place" id="place">YOUR LOCATION</div><div class="muted" id="date">Loading…</div></div><div><div class="temp" id="temp">--°</div><div id="feels">Feels --°</div><div class="muted" id="condition"></div></div></header><section class="card"><div class="legend">● TEMP &nbsp;&nbsp; <span style="color:var(--b)">● PRECIPITATION</span> · 24 HOUR TIMELINE</div><svg id="chart" class="chart" viewBox="0 0 900 330" preserveAspectRatio="none"></svg><div class="muted" id="sun"></div></section><section class="card watch"><h3 id="watchTitle">🚗 CAR WATCH</h3><p id="watch">Checking rain risk through 10 PM…</p></section><section class="card"><div class="brand">CURRENT CONDITIONS · NOW</div><div class="metrics"><div class="metric"><small>HUMIDITY</small><b id="hum">--</b></div><div class="metric"><small>UV INDEX</small><b id="uv">--</b></div><div class="metric"><small>WIND</small><b id="wind">--</b></div><div class="metric"><small>DEW POINT</small><b id="dew">--</b></div></div></section><section class="card"><div class="brand" style="margin-bottom:10px">NEXT 7 DAYS</div><div class="days" id="days"></div></section><div class="status" id="status">GBW · Open-Meteo · requesting device location…</div></main><script>const $=x=>document.getElementById(x),F=c=>Math.round(c*9/5+32),mph=k=>Math.round(k*.621371),W={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],51:['🌦️','Drizzle'],61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorm']};let lat=33.3807,lon=-84.7999,live=false;function loc(){return new Promise(r=>{if(!navigator.geolocation)return r();navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;live=true;$('place').textContent='CURRENT LOCATION';r()},()=>{$('place').textContent='NEWNAN, GA';r()},{enableHighAccuracy:true,timeout:8000,maximumAge:300000})})}function path(a){return a.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}function draw(d,n){let start=n,end=Math.min(n+24,d.hourly.time.length),t=d.hourly.temperature_2m.slice(start,end).map(F),p=d.hourly.precipitation_probability.slice(start,end),mn=Math.min(...t)-3,mx=Math.max(...t)+3,w=900,h=330,l=48,r=18,top=25,bot=42,x=i=>l+i/(Math.max(1,t.length-1))*(w-l-r),yt=v=>top+(mx-v)/(mx-mn)*(h-top-bot),yp=v=>top+(100-v)/100*(h-top-bot),tp=t.map((v,i)=>[x(i),yt(v)]),pp=p.map((v,i)=>[x(i),yp(v)]);let s='';for(let j=0;j<5;j++){let y=top+j*(h-top-bot)/4,val=Math.round(mx-j*(mx-mn)/4);s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="#333"/><text x="4" y="${y+4}" fill="#999" font-size="11">${val}°</text>`}s+=`<polygon points="${l},${h-bot} ${pp.map(q=>q.join(',')).join(' ')} ${w-r},${h-bot}" fill="#00b7ef" opacity=".22"/><path d="${path(pp)}" fill="none" stroke="#00b7ef" stroke-width="2"/><path d="${path(tp)}" fill="none" stroke="#ff6428" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;for(let i=0;i<t.length;i+=4){let dt=new Date(d.hourly.time[start+i]);s+=`<text x="${x(i)}" y="${h-12}" text-anchor="middle" fill="#999" font-size="11">${dt.toLocaleTimeString([],{hour:'numeric'})}</text>`}$('chart').innerHTML=s}async function load(){try{await loc();let u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,relative_humidity_2m,uv_index,wind_speed_10m,dew_point_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=celsius&windspeed_unit=kmh&precipitation_unit=inch&timezone=auto&forecast_days=7`,d=await(await fetch(u)).json(),now=Date.now(),n=Math.max(0,d.hourly.time.findIndex(t=>new Date(t).getTime()>=now)-1),today=new Date().toDateString(),di=Math.max(0,d.daily.time.findIndex(x=>new Date(x+'T12:00').toDateString()===today)),wx=W[d.hourly.weather_code[n]]||['🌤️','Conditions'];$('date').textContent=new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});$('temp').textContent=F(d.hourly.temperature_2m[n])+'°';$('feels').textContent='Feels '+F(d.hourly.apparent_temperature[n])+'°';$('condition').textContent=wx[0]+' '+wx[1]+' · High '+F(d.daily.temperature_2m_max[di])+'° / Low '+F(d.daily.temperature_2m_min[di])+'°';$('hum').textContent=Math.round(d.hourly.relative_humidity_2m[n])+'%';$('uv').textContent=(Math.round(d.hourly.uv_index[n]*10)/10);$('wind').textContent=mph(d.hourly.wind_speed_10m[n])+' mph';$('dew').textContent=F(d.hourly.dew_point_2m[n])+'°';$('sun').textContent='🌅 Sunrise '+new Date(d.daily.sunrise[di]).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'   ·   🌇 Sunset '+new Date(d.daily.sunset[di]).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});draw(d,n);let up=d.hourly.time.map((t,i)=>({t:new Date(t),p:d.hourly.precipitation_probability[i]||0,a:+(d.hourly.precipitation[i]||0)})).filter(o=>o.t>=new Date()&&o.t.toDateString()===today&&o.t.getHours()<=22),maxP=up.length?Math.max(...up.map(o=>o.p)):0,total=up.reduce((s,o)=>s+o.a,0);if(total>=.3){$('watchTitle').textContent='🚨 CAR WATCH · HIGH';$('watch').textContent=`About ${total.toFixed(2)}" of rain remains through 10 PM. Peak chance ${maxP}%. Treat cars/windows as exposed.`}else if(total>=.05||maxP>=60){$('watchTitle').textContent='⚠️ CAR WATCH · WATCH';$('watch').textContent=`Rain risk through 10 PM: peak ${maxP}% with roughly ${total.toFixed(2)}" forecast.`}else{$('watchTitle').textContent='✓ CAR WATCH · CLEAR';$('watch').textContent=`No meaningful rain signal through 10 PM. Peak chance ${maxP}%, about ${total.toFixed(2)}" forecast.`}$('days').innerHTML=d.daily.time.slice(di,di+7).map((x,j)=>{let i=di+j,dt=new Date(x+'T12:00'),ww=W[d.daily.weather_code[i]]||['🌤️',''];return `<div class="day"><b>${j?' '+dt.toLocaleDateString([],{weekday:'short'}).toUpperCase():'TODAY'}</b><div class="ico">${ww[0]}</div>${F(d.daily.temperature_2m_max[i])}° / ${F(d.daily.temperature_2m_min[i])}°</div>`}).join('');$('status').textContent='Gingerbeard Weather · GBW 1.0 · '+(live?'Live device location':'Fallback: Newnan, GA')+' · Open-Meteo'}catch(e){$('status').textContent='Could not load forecast. Check your connection.'}}load();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
